name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  axioms:
    uses: brandon-fox/.github/.github/workflows/ade-axioms.yml@595a8111464a72b0d27e3e7391dcc713f002a73a # main

  build:
    name: Build and verify site
    needs: [axioms]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-node-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check every link in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --remap 'https://brandon-fox.github.io/ file://${{ github.workspace }}/dist/'
            --exclude 'linkedin\.com'
            --exclude 'mailto:'
            --exclude-path dist/_astro
            dist
          fail: true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
