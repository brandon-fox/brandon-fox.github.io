name: Checks

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-size:
    # Also runs on workflow_dispatch so a signed-rebase push gets this required
    # check; the guard passes when there is no PR diff to read.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # The reusable guard reads the PR's diff; without this grant the whole
    # workflow fails at startup and no check runs at all.
    permissions:
      contents: read
      pull-requests: read
    uses: brandon-fox/.github/.github/workflows/pr-size-guard.yml@093fbcf217975354790f21e30f7ce4e4061d35c2 # main

  axioms:
    uses: brandon-fox/.github/.github/workflows/ade-axioms.yml@595a8111464a72b0d27e3e7391dcc713f002a73a # main

  content:
    name: Front matter and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-node-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check every link in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --remap 'https://brandon-fox.github.io/ file://${{ github.workspace }}/dist/'
            --exclude 'linkedin\.com'
            --exclude 'mailto:'
            --exclude-path dist/_astro
            dist
          fail: true
