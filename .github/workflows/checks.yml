name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  axioms:
    name: First-ADE axiom validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: First-ADE/.github/.github/actions/ade-axioms@a69064ab297a7be00c1b42dc13e2b89c78921888 # brand/E3-S1-principles-axioms, PR #32

  content:
    name: Front matter and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check every link in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --remap 'https://brandon-fox.github.io/ file://${{ github.workspace }}/dist/'
            --exclude 'linkedin\.com'
            --exclude 'mailto:'
            --exclude-path dist/_astro
            dist
          fail: true
