name: Signed Rebase (Reusable)

# Keeps every open same-repo PR rebased onto the base branch with verified
# commits. GitHub's own "Update branch" rebase leaves commits unsigned, so this
# rebases in the runner and recreates each commit through the Git Data API,
# which GitHub signs. Spec: specs/signed-rebase.feature.
# Decision: docs/decisions/0001-signed-auto-rebase.md.
#
# Stage 1: the built-in GITHUB_TOKEN. Its pushes don't start workflows, so the
# job dispatches the listed CI workflows itself.
# Stage 2: set the REBASE_APP_ID variable and REBASE_APP_PRIVATE_KEY secret and
# the App token is used instead. No code change.

on:
  workflow_call:
    inputs:
      base-branch:
        description: Branch PRs are rebased onto. Defaults to the default branch.
        type: string
        default: ''
      ci-workflows:
        description: Workflow files to dispatch on a rebased branch when using GITHUB_TOKEN.
        type: string
        default: ''
      pr-numbers:
        description: Limit the run to these PR numbers (comma or space separated).
        type: string
        default: ''
      max-per-run:
        description: Most PRs rebased in one run, to avoid flooding CI.
        type: number
        default: 10
      app-id:
        description: GitHub App id for stage 2. Empty means use GITHUB_TOKEN.
        type: string
        default: ''
    secrets:
      app-private-key:
        required: false

jobs:
  rebase:
    name: Rebase behind PRs with signed commits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Mint App token (stage 2)
        id: app
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Rebase and recreate commits through the API
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BASE_BRANCH: ${{ inputs.base-branch || github.event.repository.default_branch }}
          CI_WORKFLOWS: ${{ inputs.ci-workflows }}
          PR_NUMBERS: ${{ inputs.pr-numbers }}
          MAX_PER_RUN: ${{ inputs.max-per-run }}
          USING_APP_TOKEN: ${{ steps.app.outputs.token != '' }}
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const base = process.env.BASE_BRANCH;
            const maxPerRun = Number(process.env.MAX_PER_RUN || 10);
            const only = new Set((process.env.PR_NUMBERS || '').split(/[\s,]+/).filter(Boolean).map(Number));
            const ciWorkflows = (process.env.CI_WORKFLOWS || '').split(/[\s,]+/).filter(Boolean);
            const usingApp = process.env.USING_APP_TOKEN === 'true';
            const SKIP_AUTHORS = new Set(['dependabot[bot]', 'renovate[bot]']);
            const HOLD_LABEL = 'do-not-rebase';
            const FLAG_LABEL = 'needs-rebase';
            const MARKER = '<!-- signed-rebase -->';
            const TMP = 'rebase-tmp/pr-';

            const git = async (args, opts = {}) =>
              (await exec.getExecOutput('git', args, { silent: true, ignoreReturnCode: true, ...opts }));
            const out = async (args) => {
              const r = await git(args);
              if (r.exitCode !== 0) throw new Error(`git ${args.join(' ')}: ${r.stderr.trim()}`);
              return r.stdout.trim();
            };

            await out(['config', 'user.name', 'signed-rebase']);
            await out(['config', 'user.email', 'signed-rebase@users.noreply.github.com']);

            // Clear temp branches a cancelled run may have left behind.
            const { data: stale } = await github.rest.git.listMatchingRefs({ owner, repo, ref: `heads/${TMP}` });
            for (const r of stale) {
              await github.rest.git.deleteRef({ owner, repo, ref: r.ref.replace(/^refs\//, '') }).catch(() => {});
            }

            async function flag(pr, reason) {
              core.warning(`PR #${pr.number}: ${reason}`);
              const body = `${MARKER}\nAutomatic signed rebase paused: ${reason}\n\nRebase locally with signed commits and push, or add the \`${HOLD_LABEL}\` label to opt out.`;
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [FLAG_LABEL] }).catch(() => {});
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              const mine = comments.find((c) => (c.body || '').startsWith(MARKER));
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

            async function unflag(pr) {
              if ((pr.labels || []).some((l) => l.name === FLAG_LABEL)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: FLAG_LABEL }).catch(() => {});
              }
            }

            // Recreate one commit through the API. Mode 'author' keeps the original
            // author; mode 'bot' lets the token identity author it and adds a
            // Co-authored-by trailer. Returns the new sha and whether GitHub verified it.
            async function recreate(sha, parent, mode) {
              const tree = await out(['show', '-s', '--format=%T', sha]);
              let message = (await git(['show', '-s', '--format=%B', sha])).stdout.replace(/\s+$/, '') + '\n';
              const [name, email, date] = (await out(['show', '-s', '--format=%an%x00%ae%x00%aI', sha])).split('\0');
              const params = { owner, repo, message, tree, parents: [parent] };
              if (mode === 'author') params.author = { name, email, date };
              else if (!message.includes(`Co-authored-by: ${name} <${email}>`)) {
                message = `${message.replace(/\n$/, '')}\n\nCo-authored-by: ${name} <${email}>\n`;
                params.message = message;
              }
              const { data } = await github.rest.git.createCommit(params);
              const { data: check } = await github.rest.git.getCommit({ owner, repo, commit_sha: data.sha });
              return { sha: data.sha, verified: Boolean(check.verification && check.verification.verified), reason: check.verification && check.verification.reason };
            }

            async function chain(shas, baseSha, mode) {
              let parent = baseSha;
              for (const sha of shas) {
                const c = await recreate(sha, parent, mode);
                if (!c.verified) return { ok: false, reason: c.reason };
                parent = c.sha;
              }
              return { ok: true, tip: parent };
            }

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base, per_page: 100 });
            const results = [];
            let rebased = 0;
            let signingFailed = false;

            for (const pr of prs) {
              if (only.size && !only.has(pr.number)) continue;
              const labels = (pr.labels || []).map((l) => l.name);
              if (pr.head.repo == null || pr.head.repo.full_name !== `${owner}/${repo}`) { results.push([pr.number, 'skipped: fork']); continue; }
              if (SKIP_AUTHORS.has(pr.user.login)) { results.push([pr.number, 'skipped: bot rebases its own PRs']); continue; }
              if (labels.includes(HOLD_LABEL)) { results.push([pr.number, `skipped: ${HOLD_LABEL}`]); continue; }
              if (rebased >= maxPerRun) { results.push([pr.number, 'deferred: max per run']); continue; }

              const headRef = pr.head.ref;
              const headSha = pr.head.sha;
              try {
                const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${base}...${headSha}` });
                if (cmp.behind_by === 0) { await unflag(pr); results.push([pr.number, 'up to date']); continue; }

                await out(['fetch', '--no-tags', 'origin', `+refs/heads/${base}:refs/remotes/origin/${base}`, `+refs/heads/${headRef}:refs/remotes/origin/${headRef}`]);
                const baseSha = await out(['rev-parse', `refs/remotes/origin/${base}`]);
                if (await out(['rev-list', '--merges', `${baseSha}..${headSha}`])) { await flag(pr, 'the branch contains merge commits.'); results.push([pr.number, 'flagged: merge commits']); continue; }

                await out(['checkout', '-q', '--detach', headSha]);
                const rb = await git(['rebase', baseSha]);
                if (rb.exitCode !== 0) {
                  await git(['rebase', '--abort']);
                  await flag(pr, `conflicts with \`${base}\`.`);
                  results.push([pr.number, 'flagged: conflict']);
                  continue;
                }
                const shas = (await out(['rev-list', '--reverse', `${baseSha}..HEAD`])).split('\n').filter(Boolean);
                if (shas.length === 0) { await flag(pr, `every change is already on \`${base}\`.`); results.push([pr.number, 'flagged: empty after rebase']); continue; }

                // Upload the rebased trees so the API can reference them.
                const push = await git(['push', '-f', 'origin', `HEAD:refs/heads/${TMP}${pr.number}`]);
                if (push.exitCode !== 0) {
                  const why = /workflow/i.test(push.stderr) ? 'the PR changes workflow files, which this token cannot push.' : 'the push was refused.';
                  await flag(pr, why);
                  results.push([pr.number, `flagged: ${why}`]);
                  continue;
                }

                let res = await chain(shas, baseSha, 'author');
                let mode = 'author';
                if (!res.ok) { res = await chain(shas, baseSha, 'bot'); mode = 'bot'; }
                const dropTmp = () => github.rest.git.deleteRef({ owner, repo, ref: `heads/${TMP}${pr.number}` }).catch(() => {});
                if (!res.ok) {
                  await dropTmp();
                  signingFailed = true;
                  await flag(pr, `GitHub did not verify the recreated commits (${res.reason}). Nothing was changed.`);
                  results.push([pr.number, `failed: unverified (${res.reason})`]);
                  continue;
                }

                // Don't overwrite work pushed while this run was rebasing.
                const { data: now } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                if (now.head.sha !== headSha) { await dropTmp(); results.push([pr.number, 'skipped: branch moved during rebase']); continue; }
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${headRef}`, sha: res.tip, force: true });
                await dropTmp();
                rebased += 1;
                await unflag(pr);

                if (!usingApp) {
                  for (const wf of ciWorkflows) {
                    await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: wf, ref: headRef });
                  }
                }
                results.push([pr.number, `rebased ${shas.length} commit(s), signed, mode=${mode}`]);
              } catch (err) {
                results.push([pr.number, `error: ${err.message}`]);
                core.warning(`PR #${pr.number}: ${err.message}`);
              }
            }

            await core.summary
              .addHeading('Signed rebase')
              .addTable([[{ data: 'PR', header: true }, { data: 'Result', header: true }], ...results.map(([n, r]) => [`#${n}`, r])])
              .write();
            if (signingFailed) core.setFailed('GitHub did not verify recreated commits; no branch was changed for those PRs.');
